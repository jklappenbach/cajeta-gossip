name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Builds + tests the library on a main push; on a v* tag also publishes a
# GitHub Release and a signed publish to Olla (olla.cajeta.dev). Logic lives in
# the reusable workflow. No `pull_request:` trigger by design — changes land by
# pushing straight to main, so a PR trigger would never fire.
jobs:
  release:
    uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
    with:
      # FLOOR IS v0.11.0 — a correctness requirement, not a preference: G4b's
      # multicast discovery uses the NET-14 UdpSocket surface (joinGroupOn,
      # setMulticastInterface, ...), which first shipped in v0.11.0. Earlier
      # floors for the record: v0.9.4 (view element arrays, recvFromAsync).
      # Suite verified 133/133 on v0.11.0, both carrier modes.
      #
      # Pinned to the ecosystem's current release so gossip resolves beside
      # dev.cajeta.cloud / .ml / .docs rather than lagging a release train
      # behind — cajeta-dqe consumes membership from HERE and the object
      # store from cloud, and a split pin is exactly what made the
      # timeseries/recsys solver conflict unsatisfiable.
      cajeta-version: v0.17.4
      # The manifest's `test` task is self-contained (compiles test/src against
      # the built .cja, no external deps), so CI runs it directly.
      test-command: cajeta test
    secrets: inherit
